name: PR Validation

on:
  pull_request:
    branches:
      - develop

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'  # You can specify a different version if needed

      - name: Install dependencies
        run: |
          npm install
          npm install htmlhint stylelint

      - name: Lint HTML files with HTMLHint
        run: htmlhint "**/*.html"

      - name: Lint CSS files with Stylelint
        run: stylelint "**/*.css"

  build:
    runs-on: ubuntu-latest
    needs: linting  # This ensures that the build job only runs after the linting job completes
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'

      - name: Install dependencies
        run: npm install

      - name: Build static website using Parcel
        run: |
          npm install -g parcel-bundler
          parcel build src/index.html --out-dir dist --no-minify
